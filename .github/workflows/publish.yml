# .github/workflows/publish.yml
# Publishes olddevs-mcp-atlassian with PyPI Trusted Publishing (no API tokens).
# - A published GitHub Release (tag vX.Y.Z) uploads to PyPI.
# - A manual run uploads to TestPyPI (default) or PyPI.
# Each index needs a trusted publisher for this repository, this workflow file
# and the matching environment ("pypi" / "testpypi").
name: Publish olddevs-mcp-atlassian

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: "Package index to upload to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # uv-dynamic-versioning derives the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Check the version is publishable
        run: |
          ls dist
          if ls dist | grep -q '+'; then
            echo "Local version (+...) cannot be uploaded to a package index." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            expected="${GITHUB_REF_NAME#v}"
            ls dist | grep -q -- "-${expected}[.-]" || {
              echo "Built version does not match release tag ${GITHUB_REF_NAME}." >&2
              exit 1
            }
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to ${{ github.event_name == 'release' && 'pypi' || inputs.index }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.index }}
      url: ${{ (github.event_name == 'release' || inputs.index == 'pypi') && 'https://pypi.org/p/olddevs-mcp-atlassian' || 'https://test.pypi.org/p/olddevs-mcp-atlassian' }}
    permissions:
      id-token: write # Required for PyPI Trusted Publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.index == 'pypi'
        run: uv publish --trusted-publishing always dist/*

      - name: Publish to TestPyPI
        if: github.event_name != 'release' && inputs.index == 'testpypi'
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*
